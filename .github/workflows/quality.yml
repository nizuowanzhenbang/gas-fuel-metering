name: Quality checks
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENABLE_SCHEDULER: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt pytest httpx ruff
      - name: Check Python syntax and undefined names
        run: python -m ruff check backend --select E9,F63,F7,F82
      - name: Regression tests
        run: python -m pytest backend/tests --ignore=backend/tests/postgresql -q
  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gfm_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: gas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gfm_test -d gas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENABLE_SCHEDULER: 'false'
      REQUIRE_POSTGRESQL_TESTS: 'true'
      TEST_POSTGRESQL_URL: postgresql+psycopg2://gfm_test:test-only-password@127.0.0.1:5432/gas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests/postgresql -q -o addopts=''
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check and production build
        run: npm run build
